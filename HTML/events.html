<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub - Events- Sumedha Mehta</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<center>

    <img src="images/logo.png" alt="StudentHub Logo" class="logo">

    <h1>Events</h1>

    <p>Upcoming events will be displayed here.</p>

   
    <input type="text" id="search" placeholder="Search event">

    <br><br>

    <select id="filter">

        <option value="All">All</option>
        <option value="Technical">Technical</option>
        <option value="Sports">Sports</option>
        <option value="Cultural">Cultural</option>

    </select>

    <br><br>

 
    <button onclick="sortEvents()">Sort by Name</button>

    <br><br>

   
    <p id="message">Loading...</p>

    <div id="events"></div>

    <br>

   
    <button onclick="previousPage()">Previous</button>

    <button onclick="nextPage()">Next</button>

    <br><br>

    <a href="dashboard.html">Back</a>

</center>

<script src="events.js"></script>

</body>

</html>
